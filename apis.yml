aid: viewabo
name: Viewabo
description: >-
  Viewabo is an interactive visual product-support platform for modern customer
  experience, product, and field-service teams. A support agent sends a browser
  link to anyone on-site; the customer taps it and shares their smartphone camera
  in real time — with no app download and no account required — so the team can
  see the problem live through the customer's camera, guide a remote fix, and
  confirm whether an on-site dispatch is actually needed. Hardware makers,
  equipment manufacturers, and medical/industrial product teams use it to cut
  truck rolls, resolve tickets faster, and triage before dispatch. Pricing is
  usage-based per video session with unlimited seats.
